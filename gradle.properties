# Cobblemon Player XP Share - build settings
# Target: Minecraft 1.21.1 / NeoForge 21.1.249 / Cobblemon 1.8.0+1.21.1
#
# IMPORTANT: keep this file pure ASCII. Gradle reads .properties as ISO-8859-1,
# so non-ASCII characters here get mis-decoded and silently break the build.
# Text values are therefore written as \uXXXX escapes.
# The Cobblemon jar path is NOT stored here: build.gradle detects the jar in the
# project root or in libs/, or you pass -Pcobblemon_jar=<path>.

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false

group=com.cobblemon.playerxp.share
